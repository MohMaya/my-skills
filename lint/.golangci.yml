version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - wrapcheck
    - contextcheck
    - noctx
    - bodyclose
    - copyloopvar
    - cyclop
    - revive
  settings:
    cyclop:
      max-complexity: 10
    revive:
      enable-all-rules: false
      rules:
        - name: context-as-argument
        - name: use-any
